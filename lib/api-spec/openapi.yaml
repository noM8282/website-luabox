openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LuaBox API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: scripts
    description: Script management
  - name: panels
    description: Discord panel management
  - name: keys
    description: License key management
  - name: servers
    description: Discord server management
  - name: whitelist
    description: Script whitelist management
  - name: overview
    description: Dashboard overview
  - name: guilds
    description: Discord guild/channel lookups

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /overview/stats:
    get:
      operationId: getOverviewStats
      tags: [overview]
      summary: Get dashboard overview statistics
      responses:
        "200":
          description: Overview statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewStats"

  /bot/invite:
    get:
      operationId: getBotInvite
      tags: [guilds]
      summary: Get the bot invite URL with admin permissions
      responses:
        "200":
          description: Bot invite URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotInviteResponse"

  /guilds:
    get:
      operationId: listBotGuilds
      tags: [guilds]
      summary: List Discord guilds where the bot is present and user is a member
      responses:
        "200":
          description: List of guilds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuildOption"

  /guilds/{guildId}/channels:
    get:
      operationId: listGuildChannels
      tags: [guilds]
      summary: List text channels in a Discord guild
      parameters:
        - name: guildId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of text channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelOption"

  /servers/sync:
    post:
      operationId: syncServers
      tags: [servers]
      summary: Sync Discord servers where the bot is present
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /scripts:
    get:
      operationId: listScripts
      tags: [scripts]
      summary: List all scripts owned by current user
      responses:
        "200":
          description: List of scripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Script"
    post:
      operationId: createScript
      tags: [scripts]
      summary: Create a new script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptInput"
      responses:
        "201":
          description: Created script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"

  /scripts/{id}:
    get:
      operationId: getScript
      tags: [scripts]
      summary: Get a script by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateScript
      tags: [scripts]
      summary: Update a script
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptUpdate"
      responses:
        "200":
          description: Updated script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
    delete:
      operationId: deleteScript
      tags: [scripts]
      summary: Delete a script
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /scripts/{id}/toggle:
    post:
      operationId: toggleScript
      tags: [scripts]
      summary: Enable or disable a script
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated script status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"

  /panels:
    get:
      operationId: listPanels
      tags: [panels]
      summary: List all panels owned by current user
      responses:
        "200":
          description: List of panels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Panel"
    post:
      operationId: createPanel
      tags: [panels]
      summary: Create a new Discord panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelInput"
      responses:
        "201":
          description: Created panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"

  /panels/{id}:
    get:
      operationId: getPanel
      tags: [panels]
      summary: Get a panel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePanel
      tags: [panels]
      summary: Update a panel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelUpdate"
      responses:
        "200":
          description: Updated panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
    delete:
      operationId: deletePanel
      tags: [panels]
      summary: Delete a panel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /panels/{id}/send:
    post:
      operationId: sendPanel
      tags: [panels]
      summary: Send panel embed to a Discord channel via bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PanelSendInput"
      responses:
        "200":
          description: Panel sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List all license keys for current user's scripts
      responses:
        "200":
          description: List of license keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseKey"
    post:
      operationId: generateKey
      tags: [keys]
      summary: Generate a new license key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyInput"
      responses:
        "201":
          description: Generated license key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"

  /keys/{id}:
    get:
      operationId: getKey
      tags: [keys]
      summary: Get a license key by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: License key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"
    delete:
      operationId: deleteKey
      tags: [keys]
      summary: Delete a license key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /keys/{id}/revoke:
    post:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke a license key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"

  /keys/{id}/reset-hwid:
    post:
      operationId: resetHwid
      tags: [keys]
      summary: Clear the bound HWID for a license key so it can be rebound on next execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HWID cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List connected Discord servers
      responses:
        "200":
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscordServer"

  /servers/{id}:
    delete:
      operationId: disconnectServer
      tags: [servers]
      summary: Disconnect a Discord server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /scripts/{id}/whitelist:
    get:
      operationId: listWhitelist
      tags: [whitelist]
      summary: List whitelist entries for a script
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of whitelist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhitelistEntry"
    post:
      operationId: addToWhitelist
      tags: [whitelist]
      summary: Add a Discord user to script whitelist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhitelistInput"
      responses:
        "201":
          description: Added whitelist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhitelistEntry"

  /scripts/{id}/whitelist/{entryId}:
    delete:
      operationId: removeFromWhitelist
      tags: [whitelist]
      summary: Remove a Discord user from script whitelist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    User:
      type: object
      required: [id, discordId, username, createdAt]
      properties:
        id:
          type: integer
        discordId:
          type: string
        username:
          type: string
        avatar:
          type: ["string", "null"]
        createdAt:
          type: string

    OverviewStats:
      type: object
      required: [totalScripts, totalPanels, totalKeys, activeUsers, connectedServers]
      properties:
        totalScripts:
          type: integer
        totalPanels:
          type: integer
        totalKeys:
          type: integer
        activeUsers:
          type: integer
        connectedServers:
          type: integer

    GuildOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: ["string", "null"]

    ChannelOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    BotInviteResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    SyncResult:
      type: object
      required: [synced, total]
      properties:
        synced:
          type: integer
        total:
          type: integer

    Script:
      type: object
      required: [id, ownerId, name, version, status, createdAt]
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        version:
          type: string
        status:
          type: string
          enum: [active, disabled]
        content:
          type: ["string", "null"]
        obfuscatedContent:
          type: ["string", "null"]
        createdAt:
          type: string

    ScriptInput:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        version:
          type: string
          minLength: 1
        content:
          type: string

    ScriptUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        version:
          type: string
          minLength: 1
        status:
          type: string
          enum: [active, disabled]
        content:
          type: string

    Panel:
      type: object
      required: [id, ownerId, scriptId, name, createdAt]
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        scriptId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        discordServerId:
          type: ["string", "null"]
        channelId:
          type: ["string", "null"]
        messageId:
          type: ["string", "null"]
        buyerRoleId:
          type: ["string", "null"]
        requiredRoles:
          type: array
          items:
            type: string
        createdAt:
          type: string

    PanelInput:
      type: object
      required: [scriptId, name]
      properties:
        scriptId:
          type: integer
        name:
          type: string
          minLength: 1
        description:
          type: string
        discordServerId:
          type: string
        channelId:
          type: string
        buyerRoleId:
          type: string
        requiredRoles:
          type: array
          items:
            type: string

    PanelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        discordServerId:
          type: string
        channelId:
          type: string
        buyerRoleId:
          type: string
        requiredRoles:
          type: array
          items:
            type: string

    PanelSendInput:
      type: object
      required: [channelId]
      properties:
        channelId:
          type: string

    LicenseKey:
      type: object
      required: [id, key, scriptId, status, createdAt]
      properties:
        id:
          type: integer
        key:
          type: string
        scriptId:
          type: integer
        userId:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, revoked, expired]
        whitelisted:
          type: boolean
        hwid:
          type: ["string", "null"]
        createdAt:
          type: string

    KeyInput:
      type: object
      required: [scriptId]
      properties:
        scriptId:
          type: integer
        userId:
          type: integer
        expiresAt:
          type: string
        whitelisted:
          type: boolean

    DiscordServer:
      type: object
      required: [id, guildId, name, createdAt]
      properties:
        id:
          type: integer
        guildId:
          type: string
        name:
          type: string
        ownerId:
          type: integer
        createdAt:
          type: string

    WhitelistEntry:
      type: object
      required: [id, scriptId, discordUserId, createdAt]
      properties:
        id:
          type: integer
        scriptId:
          type: integer
        discordUserId:
          type: string
        addedBy:
          type: ["string", "null"]
        createdAt:
          type: string

    WhitelistInput:
      type: object
      required: [discordUserId]
      properties:
        discordUserId:
          type: string
        addedBy:
          type: string
